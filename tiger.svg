<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="600" height="600">
  <defs>
    <radialGradient id="fur" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#ffc56e"/>
      <stop offset=".6" stop-color="#f4a043"/>
      <stop offset="1" stop-color="#d9782a"/>
    </radialGradient>
    <radialGradient id="cream" cx="50%" cy="35%" r="65%">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#f6e6cf"/>
    </radialGradient>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- 털 바탕 -->
  <rect width="150" height="150" fill="url(#fur)"/>

  <g filter="url(#wob)" fill="#4a2a18" opacity=".88">
    <!-- 이마 줄무늬 -->
    <path d="M75 14 C71 22 71 30 75 38 C79 30 79 22 75 14 Z"/>
    <path d="M58 22 C60 28 64 33 70 36 C67 30 63 25 58 22 Z"/>
    <path d="M92 22 C90 28 86 33 80 36 C83 30 87 25 92 22 Z"/>
    <path d="M62 44 Q75 39 88 44 Q75 42 62 44 Z" opacity=".7"/>
    <!-- 옆 줄무늬 -->
    <path d="M0 58 C10 58 20 62 26 68 C18 66 8 66 0 68 Z"/>
    <path d="M0 80 C10 79 18 82 24 87 C16 86 8 87 0 90 Z"/>
    <path d="M4 40 C12 42 18 46 22 52 C15 49 9 48 2 48 Z"/>
    <path d="M150 58 C140 58 130 62 124 68 C132 66 142 66 150 68 Z"/>
    <path d="M150 80 C140 79 132 82 126 87 C134 86 142 87 150 90 Z"/>
    <path d="M146 40 C138 42 132 46 128 52 C135 49 141 48 148 48 Z"/>
  </g>

  <!-- 눈 위 흰 털 -->
  <ellipse cx="50" cy="62" rx="11" ry="6" fill="#fff5e6" opacity=".85"/>
  <ellipse cx="100" cy="62" rx="11" ry="6" fill="#fff5e6" opacity=".85"/>

  <!-- 주둥이 / 턱 -->
  <g filter="url(#wob)">
    <path fill="url(#cream)" d="M28 150 C28 120 40 98 56 96 C64 95 70 98 75 102 C80 98 86 95 94 96 C110 98 122 120 122 150 Z"/>
    <ellipse cx="61" cy="104" rx="17" ry="13" fill="url(#cream)"/>
    <ellipse cx="89" cy="104" rx="17" ry="13" fill="url(#cream)"/>
  </g>

  <!-- 눈 -->
  <g>
    <ellipse cx="50" cy="76" rx="8.5" ry="9.5" fill="#2d1a10"/>
    <ellipse cx="100" cy="76" rx="8.5" ry="9.5" fill="#2d1a10"/>
    <circle cx="53" cy="72" r="3.3" fill="#fff"/>
    <circle cx="103" cy="72" r="3.3" fill="#fff"/>
    <circle cx="47.5" cy="80" r="1.5" fill="#fff" opacity=".8"/>
    <circle cx="97.5" cy="80" r="1.5" fill="#fff" opacity=".8"/>
  </g>

  <!-- 수염 점 -->
  <g fill="#c9a88a">
    <circle cx="56" cy="104" r="1.3"/><circle cx="62" cy="108" r="1.3"/><circle cx="54" cy="111" r="1.3"/>
    <circle cx="94" cy="104" r="1.3"/><circle cx="88" cy="108" r="1.3"/><circle cx="96" cy="111" r="1.3"/>
  </g>

  <!-- 코 -->
  <path d="M67 92 Q75 88 83 92 Q81 99 75 100 Q69 99 67 92 Z" fill="#e2747a"/>
  <ellipse cx="73" cy="92" rx="2.6" ry="1.4" fill="#fff" opacity=".6"/>

  <!-- 입 -->
  <g fill="none" stroke="#4a2a18" stroke-width="2" stroke-linecap="round">
    <path d="M75 100 L75 105"/>
    <path d="M75 105 Q69 111 63 107"/>
    <path d="M75 105 Q81 111 87 107"/>
  </g>
  <!-- 혀 -->
  <path d="M71 109 Q75 116 79 109 Q75 110.5 71 109 Z" fill="#f0828a"/>
</svg>
